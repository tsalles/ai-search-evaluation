[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "synthetic-document-generator"
version = "0.1.0"
description = "Controlled synthetic corpora for document retrieval studies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "filelock>=3.16,<4",
  "azure-core>=1.31,<2",
  "azure-identity>=1.24,<2",
  "azure-storage-blob>=12.24,<13",
  "python-dotenv>=1.0,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "langdetect>=1.0.9,<2",
  "six>=1.17,<2",
  "openai>=2.0,<3",
  "networkx>=3.4,<4",
  "markdown-it-py>=3,<5",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
  "reportlab>=4.2,<5",
  "pypdf>=5,<7",
  "pdfplumber>=0.11,<1",
  "ir-measures>=0.4,<1",
  "pytrec-eval-terrier>=0.5.7,<1",
  "tiktoken>=0.9,<1",
]

[project.scripts]
docgen = "docgen.cli:main"

[project.optional-dependencies]
dev = [
  "azure-functions>=1.21,<2",
  "psutil>=6,<8",
  "defusedxml>=0.7,<1",
  "build>=1.2,<2",
  "hatchling==1.27.0",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6,<7",
  "types-networkx>=3.4,<4",
  "types-openpyxl>=3.1,<4",
  "types-reportlab>=4.2,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docgen"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src", "tests", "scripts", "docs", "examples", "services",
  "infra/saas-confirmation/main.bicep",
  "pyproject.toml", "README.md", "requirements-dev.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra -m 'not live'"
markers = ["live: explicitly opted-in paid Azure tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/docgen"]

[[tool.mypy.overrides]]
module = ["langdetect", "langdetect.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["docgen"]

[tool.coverage.report]
show_missing = true
